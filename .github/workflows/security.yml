name: Security

# Shared internal/public backstop, matching the iOS repositories' scanner policy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    uses: lavasecurity/.github/.github/workflows/security.yml@bbba4b6150d8b2674453e8fe47a835fd423b6b4c
    with:
      gitleaks: true
      mobsfscan: true
