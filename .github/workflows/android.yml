name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]

# Required contexts always report. Classify inside jobs instead of paths-ignore or skip-ci.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      native_required: ${{ steps.scope.outputs.native_required }}
      engine_required: ${{ steps.scope.outputs.engine_required }}
      full_build: ${{ steps.scope.outputs.full_build }}
      qualification_required: ${{ steps.scope.outputs.qualification_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete event diff
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-build') }}
        run: |
          set -euo pipefail
          classifier=ci/android_ci_scope.py
          if [ "$EVENT" = pull_request ]; then
            classifier="$RUNNER_TEMP/android-ci-scope.py"
            # A PR cannot rewrite its own scheduling policy. Bootstrap or missing base runs fully.
            if ! git show "$BASE:ci/android_ci_scope.py" > "$classifier"; then
              printf 'docs_only=false\nnative_required=true\nengine_required=true\nfull_build=true\nqualification_required=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          force=()
          [ "$FORCE_FULL" != true ] || force+=(--force-full)
          python3 "$classifier" --event "$EVENT" --base "$BASE" --head "$HEAD" \
            --repository "$GITHUB_REPOSITORY" "${force[@]}"

  repo-checks:
    name: Repo Checks
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - name: Require successful input classification
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: Require a trusted internal branch
        if: ${{ github.repository == 'lavasecurity/lavasec-android-internal' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          echo '::error::Internal validation requires a reviewed branch in this repository.'
          exit 1
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation and workflow contracts
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: python3 -m unittest ci.test_android_ci_scope ci.test_android_workflow.AndroidWorkflowContractTest ci.test_android_react_native_contract -v
      - name: Set up JDK 21
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/react-native/package-lock.json
      - name: Set up Android SDK
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3.2.2 defaults to `tools platform-tools`, but `tools` was removed from the SDK
          # repository, so the action failed with "Failed to find package 'tools'" before the build
          # could start. Install only platform-tools here; the workflow installs the platforms and
          # build-tools it needs explicitly below.
          packages: 'platform-tools'
      - name: Install source-fixture SDK
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle dependency cache
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Verify the generated filter catalog against its canonical commit
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        env:
          CATALOG_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          CATALOG_HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          # Only catalog adoption depends on upstream availability; unrelated PRs stay local.
          if [ -n "$CATALOG_BASE" ] && [ -n "$CATALOG_HEAD" ] &&
             git diff --quiet "$CATALOG_BASE" "$CATALOG_HEAD" -- android/app/src/main/assets/catalog scripts/sync-filter-catalog.mjs scripts/test-sync-filter-catalog.mjs; then
            echo "Catalog snapshot unchanged"
          else
            node scripts/sync-filter-catalog.mjs android/app/src/main/assets/catalog/blocklist-catalog.json --check
          fi
      - name: Verify source contracts
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: |
          python3 - <<'PY_DISCOVERY'
          import sys
          import unittest
          loader = unittest.TestLoader()
          suite = loader.discover("ci", pattern="test_*.py")
          if loader.errors:
              for error in loader.errors:
                  print(error, file=sys.stderr)
              raise SystemExit(1)
          print(f"Source discovery: {suite.countTestCases()} cases; no import failures")
          PY_DISCOVERY
          node --test scripts/test-sync-filter-catalog.mjs
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          scripts/verify-android-foundation
      - name: Report documentation scope
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: echo 'Documentation-only change; required checks report without native builds.' >> "$GITHUB_STEP_SUMMARY"

  lava-ui:
    name: Lava UI types, contracts, and Android bundle
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Require successful input classification
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/react-native/package-lock.json
      - name: Verify React Native types and behavior
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: android/react-native
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          node scripts/apply-native-screens-retirement-fix.mjs
          node scripts/apply-core-removal-notification-fix.mjs
          node --test scripts/tests/native-screens-retirement-fix.test.mjs scripts/tests/core-removal-notification-fix.test.mjs
          npm test
      - name: Bundle the shipping Android entry point
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: android/react-native
        run: npm run bundle:android
      - name: Report documentation scope
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: echo 'Documentation-only change; required checks report without native builds.' >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Android Unit Tests
    needs: [changes, repo-checks]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - name: Require successful input classification
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: Require repository checks
        if: ${{ needs.repo-checks.result != 'success' }}
        run: exit 1
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3.2.2 defaults to `tools platform-tools`, but `tools` was removed from the SDK
          # repository, so the action failed with "Failed to find package 'tools'" before the build
          # could start. Install only platform-tools here; the workflow installs the platforms and
          # build-tools it needs explicitly below.
          packages: 'platform-tools'
      - name: Set up Node.js
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/react-native/package-lock.json
      - name: Set up Gradle dependency cache
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Install Android SDK 36
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run core and both edition unit tests
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace testDebugUnitTest :app:testPlayDebugUnitTest :app:testFossDebugUnitTest
      - name: Retain failed unit test and lint diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unit-test-diagnostics
          path: |
            android/*/build/test-results/**
            android/*/build/reports/tests/**
            android/*/build/reports/lint-results-*.html
            android/*/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 1
      - name: Report documentation scope
        if: ${{ needs.changes.outputs.docs_only == 'true' }}
        run: echo 'Documentation-only change; required checks report without native builds.' >> "$GITHUB_STEP_SUMMARY"

  app-compile:
    name: App compile (Debug, no release signing)
    needs: [changes, repo-checks, lava-ui]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ${{ (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.native_required == 'false') && 'ubicloud-standard-2' || 'ubicloud-standard-4' }}
    timeout-minutes: 45
    steps:
      - name: Require successful input classification
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: Require repository and UI checks
        if: ${{ needs.repo-checks.result != 'success' || needs.lava-ui.result != 'success' }}
        run: exit 1
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 21
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3.2.2 defaults to `tools platform-tools`, but `tools` was removed from the SDK
          # repository, so the action failed with "Failed to find package 'tools'" before the build
          # could start. Install only platform-tools here; the workflow installs the platforms and
          # build-tools it needs explicitly below.
          packages: 'platform-tools'
      - name: Install Android SDK 36
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        run: >-
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          "ndk;27.2.12479018" "cmake;3.30.5"
      - name: Install the stable non-production debug keystore
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        # A committed, non-secret debug keystore makes successive debug APKs update-compatible
        # across ephemeral runners (the auto-generated per-runner keystore is not). Debug-only:
        # release signing lineage is untouched and no release/secret credential is involved.
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/lavasec-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Set up Gradle dependency cache
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Set up Node.js
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/react-native/package-lock.json
      - name: Build the WireGuard engine into jniLibs
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        # Owned runs only: a fork PR must not execute PR-authored build scripts, and the
        # engine's own workflow already proves the cross-compile. `github.repository` is the
        # BASE repo on a pull_request, so the fork test must compare the head repo explicitly.
        run: bash scripts/prepare-wireguard-core-android.sh
      - name: Compile and lint both Debug editions
        if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.native_required != 'false' }}
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace "-PlavaDebugKeystore=$HOME/.android/debug.keystore" lintDebug :app:lintPlayDebug :app:lintFossDebug :app:assemblePlayDebug :app:assembleFossDebug :vpn:assembleDebugAndroidTest :app:assemblePlayDebugAndroidTest
      - name: Report native build scope
        if: ${{ needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.native_required == 'false' }}
        run: echo 'Native inputs unchanged; repository and UI validation passed.' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Android build
    needs: [changes, repo-checks, lava-ui, unit-tests, app-compile]
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Require all prerequisite tiers
        if: ${{ needs.changes.result != 'success' || needs.repo-checks.result != 'success' || needs.lava-ui.result != 'success' || needs.unit-tests.result != 'success' || (github.repository == 'lavasecurity/lavasec-android-internal' && needs.app-compile.result != 'success') }}
        run: exit 1
      - name: Report native build scope
        if: ${{ needs.changes.outputs.full_build != 'true' }}
        run: echo 'Required source, UI and unit tiers passed; this diff needs no full Release packaging.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out source
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3.2.2 defaults to `tools platform-tools`, but `tools` was removed from the SDK
          # repository, so the action failed with "Failed to find package 'tools'" before the build
          # could start. Install only platform-tools here; the workflow installs the platforms and
          # build-tools it needs explicitly below.
          packages: 'platform-tools'

      - name: Install Android SDK 36
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: >-
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          "ndk;27.2.12479018" "cmake;3.30.5"

      - name: Install the stable non-production debug keystore
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        # A committed, non-secret debug keystore makes successive debug APKs update-compatible
        # across ephemeral runners (the auto-generated per-runner keystore is not). Debug-only:
        # release signing lineage is untouched and no release/secret credential is involved.
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/lavasec-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up Gradle dependency cache
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Node.js
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/react-native/package-lock.json

      - name: Build the WireGuard engine into jniLibs
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        # Owned runs only: a fork PR must not execute PR-authored build scripts, and the
        # engine's own workflow already proves the cross-compile. `github.repository` is the
        # BASE repo on a pull_request, so the fork test must compare the head repo explicitly.
        run: bash scripts/prepare-wireguard-core-android.sh

      - name: Verify and build
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace "-PlavaDebugKeystore=$HOME/.android/debug.keystore" lintDebug :vpn:assembleDebugAndroidTest :app:assemblePlayDebugAndroidTest :app:lintPlayDebug :app:lintFossDebug :app:assemblePlayDebug :app:assembleFossDebug :app:bundlePlayRelease :app:assemblePlayRelease :app:bundleFossRelease :app:assembleFossRelease :app:dependencies --configuration fossReleaseRuntimeClasspath | tee "$RUNNER_TEMP/foss-dependencies.txt"

      - name: Verify packaged runtime assets
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          set -euo pipefail
          for edition in play foss; do
            title="${edition^}"
            python3 ci/verify_android_bundle.py \
              "android/app/build/outputs/bundle/${edition}Release/app-${edition}-release.aab" \
              --edition "$edition" \
              --jni-root "android/app/build/intermediates/stripped_native_libs/${edition}Release/strip${title}ReleaseDebugSymbols/out/lib" \
              --js-bundle android/app/src/main/assets/index.android.bundle
          done

      - name: Audit FOSS resolved dependencies and packaged integrations
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl --fail --location --silent --show-error --output "$bundletool" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$bundletool" | sha256sum --check
          python3 ci/verify_foss_boundary.py \
            --bundle android/app/build/outputs/bundle/fossRelease/app-foss-release.aab \
            --bundletool "$bundletool" \
            --dependencies "$RUNNER_TEMP/foss-dependencies.txt" \
            --output android/app/build/outputs/bundle/fossRelease/foss-boundary.json
          cp "$RUNNER_TEMP/foss-dependencies.txt" android/app/build/outputs/bundle/fossRelease/foss-dependencies.txt

      - name: Retain effective public build configuration
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          python3 ci/android_public_config_evidence.py --root . --variants playDebug playRelease fossDebug fossRelease \
            --output "$RUNNER_TEMP/android-public-configuration.json"
          for edition in play foss; do
            cp "$RUNNER_TEMP/android-public-configuration.json" "android/app/build/outputs/apk/$edition/debug/android-public-configuration.json"
            cp "$RUNNER_TEMP/android-public-configuration.json" "android/app/build/outputs/bundle/${edition}Release/android-public-configuration.json"
          done

      - name: Retain failed unit test and lint diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-verification-diagnostics
          path: |
            android/*/build/test-results/**
            android/*/build/reports/tests/**
            android/*/build/reports/lint-results-*.html
            android/*/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Upload debug APK
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lavasec-android-debug-apk
          path: |
            android/app/build/outputs/apk/*/debug/*.apk
            android/app/build/outputs/apk/*/debug/android-public-configuration.json
          if-no-files-found: error
          # Ephemeral CI artifact: a PR build only needs to be installable for a day. At ~40 MB
          # each and many runs per day, a long window is what drove the account's GitHub Actions
          # artifact-storage overage. Reruns on Ubicloud are cheap, so keep this tight.
          retention-days: 1

      - name: Upload unsigned release AAB
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lavasec-android-release-unsigned-aab
          path: |
            android/app/build/outputs/bundle/*Release/*.aab
            android/app/build/outputs/bundle/fossRelease/foss-boundary.json
            android/app/build/outputs/bundle/fossRelease/foss-dependencies.txt
            android/app/build/outputs/apk/foss/release/*.apk
            android/app/build/outputs/bundle/*Release/android-public-configuration.json
          if-no-files-found: error
          # Inspection-only bundle (never installed on a device), so retain it for the run only.
          retention-days: 1

      - name: Sign the optimized startup candidate with the public test signer
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/android-minified-startup"
          tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          mkdir -p "$candidate"
          "$tools/zipalign" -f -P 16 4 android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk "$RUNNER_TEMP/aligned-release.apk"
          "$tools/apksigner" sign --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out "$candidate/app-release.apk" "$RUNNER_TEMP/aligned-release.apk"
          "$tools/apksigner" verify --print-certs "$candidate/app-release.apk" > "$candidate/signer.txt"
          "$tools/zipalign" -c -P 16 4 "$candidate/app-release.apk"
          "$tools/aapt2" dump badging "$candidate/app-release.apk" > "$candidate/badging.txt"
          grep -F "package: name='com.lavasec.app'" "$candidate/badging.txt"
          if grep -Fq 'application-debuggable' "$candidate/badging.txt"; then
            echo "::error::The startup candidate must be the optimized release variant."
            exit 1
          fi
          git rev-parse HEAD > "$candidate/source-sha.txt"
          (cd "$candidate" && sha256sum app-release.apk > app-release.apk.sha256)

      - name: Retain the optimized startup candidate
        if: ${{ needs.changes.outputs.full_build == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-minified-startup
          path: ${{ runner.temp }}/android-minified-startup/
          if-no-files-found: error
          retention-days: 1


  minified-startup:
    name: Minified Android startup API 34
    needs: [changes, build]
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.build.result == 'success' && needs.changes.outputs.full_build == 'true' }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - name: Download the optimized candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-minified-startup
          path: ${{ runner.temp }}/android-minified-startup

      - name: Prepare the Android 14 emulator
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-user/avd
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          sdkmanager "build-tools;36.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name lava-minified \
            --package "system-images;android-34;google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/lava-minified.avd"
          sed -i '/^disk\.dataPartition\.size[[:space:]]*=/d' "$ANDROID_AVD_HOME/lava-minified.avd/config.ini"
          printf '\ndisk.dataPartition.size=2G\n' >> "$ANDROID_AVD_HOME/lava-minified.avd/config.ini"

      - name: Launch and interact with the actual minified UI
        env:
          ANDROID_SERIAL: emulator-5554
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-user/avd
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/device-evidence/minified-startup"
          mkdir -p "$evidence"
          candidate="$RUNNER_TEMP/android-minified-startup"
          test "$(cat "$candidate/source-sha.txt")" = "$(git rev-parse HEAD)"
          (cd "$candidate" && sha256sum --check app-release.apk.sha256)
          cp "$candidate/source-sha.txt" "$candidate/app-release.apk.sha256" "$candidate/signer.txt" "$evidence/"
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd lava-minified -port 5554 -no-window \
            -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect \
            -memory 3072 -cores 2 -accel on > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout --kill-after=5s 20s adb start-server
          boot_deadline=$((SECONDS + 300))
          until [[ "$(timeout --kill-after=5s 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            kill -0 "$emulator_pid"
            (( SECONDS < boot_deadline ))
            sleep 2
          done
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout --kill-after=5s 90s adb install --no-incremental "$candidate/app-release.apk"
          python3 ci/android_minified_startup.py --evidence "$evidence"

      - name: Retain optimized startup evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-minified-startup-evidence
          path: device-evidence/minified-startup/
          if-no-files-found: warn
          retention-days: 1
