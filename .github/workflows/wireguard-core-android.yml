name: WireGuard engine (Android)

# Builds ThirdParty/wireguard-core for the four Android ABIs, runs the host-side
# engine ABI tests, and uploads the `.so`s. Mirrors the iOS
# `wireguard-core-drift` gate's structure: it ALWAYS completes on a PR (self-skips
# when no engine/script/workflow file changed) so it can later become a required
# check without the path-filtered "Expected — waiting" deadlock, and it never runs
# on fork PRs (it executes cargo on owned hardware).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: wireguard-core-android-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect change scope
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-2' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      native_required: ${{ steps.scope.outputs.native_required }}
      engine_required: ${{ steps.scope.outputs.engine_required }}
      full_build: ${{ steps.scope.outputs.full_build }}
      qualification_required: ${{ steps.scope.outputs.qualification_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete event diff
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-build') }}
        run: |
          set -euo pipefail
          classifier=ci/android_ci_scope.py
          if [ "$EVENT" = pull_request ]; then
            classifier="$RUNNER_TEMP/android-ci-scope.py"
            # A PR cannot rewrite its own scheduling policy. Bootstrap or missing base runs fully.
            if ! git show "$BASE:ci/android_ci_scope.py" > "$classifier"; then
              printf 'docs_only=false\nnative_required=true\nengine_required=true\nfull_build=true\nqualification_required=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          force=()
          [ "$FORCE_FULL" != true ] || force+=(--force-full)
          python3 "$classifier" --event "$EVENT" --base "$BASE" --head "$HEAD" \
            --repository "$GITHUB_REPOSITORY" "${force[@]}"

  build:
    name: Build Android ABIs + host ABI tests
    needs: scope
    if: ${{ !cancelled() && github.event.pull_request.draft != true && needs.scope.outputs.engine_required != 'false' && (github.repository != 'lavasecurity/lavasec-android-internal' || github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ${{ (github.repository == 'lavasecurity/lavasec-android-internal' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))) && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - name: Require successful input classification
        if: ${{ needs.scope.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 (for sdkmanager)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK + pinned NDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # v3.2.2 defaults to `tools platform-tools`, but `tools` was removed from the SDK
          # repository, so the action failed with "Failed to find package 'tools'". Install only
          # platform-tools; the NDK is installed explicitly below.
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Cache cargo + rustup
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ThirdParty/wireguard-core/target
            ThirdParty/doq-core/target
            ~/.rustup
          key: wgcore-android-${{ runner.os }}-${{ hashFiles('ThirdParty/wireguard-core/rust-toolchain.toml', 'ThirdParty/wireguard-core/Cargo.lock', 'ThirdParty/doq-core/Cargo.lock') }}

      - name: Provision the pinned Rust toolchain + Android targets
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          cd ThirdParty/wireguard-core
          rustup show           # installs the rust-toolchain.toml pin
          rustup target add \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-ndk
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked --version 3.5.4

      - name: Host-side engine ABI tests
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cd ThirdParty/wireguard-core
          # Dev profile: the release profile sets panic=abort, which the test harness
          # cannot use. The ABI logic under test is profile-independent.
          cargo test
          cd ../doq-core
          cargo test --locked
          cargo run --locked --release --example crypto-release-regression

      - name: Cross-compile the four Android ABIs
        run: |
          set -euo pipefail
          export PATH="${HOME}/.cargo/bin:${PATH}"
          bash scripts/build-wireguard-core-android.sh
          bash scripts/build-doq-core-android.sh

      - name: Upload the per-ABI shared libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lavasec-wireguard-core-android
          path: android/vpn/src/main/jniLibs/**/liblavasec_wireguard_core.so
          if-no-files-found: error
          # Ephemeral CI artifact: the engine is rebuilt on demand by this lane; a long retention
          # window only accrues GitHub Actions artifact-storage charges.
          retention-days: 1

      - name: Upload the per-ABI DoQ shared libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lavasec-doq-core-android
          path: android/vpn/src/main/jniLibs/**/liblavasec_doq_core.so
          if-no-files-found: error
          retention-days: 1
