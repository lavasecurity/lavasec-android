[package]
name = "lavasec-doq-core"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Socket-free, certificate-verifying DoQ packet engine for Android"

[lib]
name = "lavasec_doq_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
quiche = "=0.28.0"
jni = "=0.21.1"
getrandom = "=0.2.17"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = "debuginfo"
codegen-units = 1
