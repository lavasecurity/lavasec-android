[versions]
billing = "9.1.0"
playIntegrity = "1.6.0"
credentials = "1.6.0"
googleId = "1.2.1"
# Credential Manager's Google adapter already resolves this FIDO2 runtime. The public local
# authenticator-availability probe also needs its API on the app's compile classpath.
googleFido = "21.0.0"
agp = "9.3.0"
kotlin = "2.4.10"
composeBom = "2026.06.00"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
coroutines = "1.10.2"
coroutinesTest = "1.10.2"
okhttp = "4.12.0"
icu4j = "77.1"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxJunit = "1.3.0"
androidxTestRunner = "1.7.0"
robolectric = "4.16.1"
dataStore = "1.2.0"
workManager = "2.11.2"
window = "1.5.1"
# React Native foreground host (Android). hermes is the Hermes V1 runtime
# artifact name pinned by react-native 0.87.1's sdks/hermes-engine/version.properties.
reactNative = "0.87.1"
hermes = "250829098.0.17"
# Offline QR decode for the camera filter-import path. Apache-2.0, pure Java, no
# network/Play-Services runtime: the scanner never leaves the device.
zxing = "3.5.3"

[libraries]
androidx-window = { module = "androidx.window:window", version.ref = "window" }
google-play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
google-play-integrity = { module = "com.google.android.play:integrity", version.ref = "playIntegrity" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
google-fido = { module = "com.google.android.gms:play-services-fido", version.ref = "googleFido" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "workManager" }
react-android = { module = "com.facebook.react:react-android", version.ref = "reactNative" }
hermes-android = { module = "com.facebook.hermes:hermes-android", version.ref = "hermes" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
