org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# Release keeps resource shrinking (isShrinkResources) but must NOT obfuscate
# resource names: React Native resolves packaged drawable assets by their
# generated name at runtime (AssetSourceResolver -> Resources.getIdentifier),
# so renaming `node_modules_*` drawables breaks JS-required images. Name
# obfuscation is what this disables; removal is controlled by the shrinker's
# keep rules.
android.enableResourceOptimizations=false
kotlin.code.style=official

newArchEnabled=true
hermesEnabled=true
